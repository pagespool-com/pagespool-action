# Generated by listing-sync (infra apps/observatory/listing_sync/connectors); edits are overwritten.
# Runs the action from this repo against the live API on every push, without a key (the anonymous tier).
name: smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: get_me
        id: get_me
        uses: ./
        with:
          operation: get_me
      - name: list_jobs
        id: list_jobs
        uses: ./
        with:
          operation: list_jobs
      - name: gotenberg_health
        id: gotenberg_health
        uses: ./
        with:
          operation: gotenberg_health
      - name: gotenberg_version
        id: gotenberg_version
        uses: ./
        with:
          operation: gotenberg_version
      - name: verapdf_info
        id: verapdf_info
        uses: ./
        with:
          operation: verapdf_info
      - name: verapdf_list_profiles
        id: verapdf_list_profiles
        uses: ./
        with:
          operation: verapdf_list_profiles
      - name: weasyprint_render
        id: weasyprint_render
        uses: ./
        with:
          operation: weasyprint_render
          json: |
            {
              "filename": "invoice.pdf",
              "html": "<!doctype html>\n<style>\n@page { size: A4; margin: 22mm }\nbody { font: 11pt/1.5 sans-serif; color: #1c2024 }\ntable { width: 100%; border-collapse: collapse }\nth { text-align: left; border-bottom: 2px solid #1c2024 }\ntd { padding: 3mm 0; border-bottom: 1px solid #e3e6ea }\n</style>\n<h1>Invoice 2026-041</h1>\n<p>Northwind Studio · Due Sep 30, 2026</p>\n<table>\n  <thead><tr><th>Description</th><th>Qty</th><th>Amount</th></tr></thead>\n  <tbody>\n    <tr><td>Design retainer, September</td><td>1</td><td>1,800.00</td></tr>\n    <tr><td>Illustration, cover set</td><td>6</td><td>720.00</td></tr>\n  </tbody>\n</table>\n"
            }
      - name: Check every answer was written
        shell: bash
        env:
          OUT_0: ${{ steps.get_me.outputs.output }}
          OUT_1: ${{ steps.list_jobs.outputs.output }}
          OUT_2: ${{ steps.gotenberg_health.outputs.output }}
          OUT_3: ${{ steps.gotenberg_version.outputs.output }}
          OUT_4: ${{ steps.verapdf_info.outputs.output }}
          OUT_5: ${{ steps.verapdf_list_profiles.outputs.output }}
          OUT_6: ${{ steps.weasyprint_render.outputs.output }}
        run: |
          set -euo pipefail
          for out in "$OUT_0" "$OUT_1" "$OUT_2" "$OUT_3" "$OUT_4" "$OUT_5" "$OUT_6"; do
            test -s "$out" || { echo "::error::empty answer: $out"; exit 1; }
          done
